ekf_filter_node:
  ros__parameters:
    # Частота работы фильтра
    frequency: 50.0
    sensor_timeout: 0.1
    two_d_mode: true  # работаем в 2D (по плоскости), так как робот ездит по полу

    # Системы координат
    map_frame: map
    odom_frame: odom
    base_link_frame: base_link
    world_frame: odom  # фильтр работает относительно odom

    # Входные данные: одометрия от Point-LIO
    odom0: /Odometry
    odom0_config: [true,  true,  false,   # x, y, z
                   false, false, true,    # roll, pitch, yaw
                   false, false, false,   # vx, vy, vz
                   false, false, false,   # vroll, vpitch, vyaw
                   false, false, false]   # ax, ay, az
    odom0_differential: false
    odom0_queue_size: 20

    # Входные данные: IMU от лидара
    imu0: /unilidar/imu
    imu0_config: [false, false, false,    # x, y, z
                  false, false, true,     # roll, pitch, yaw
                  false, false, false,    # vx, vy, vz
                  false, false, false,    # vroll, vpitch, vyaw
                  false, false, false]    # ax, ay, az
    imu0_differential: false
    imu0_queue_size: 20
    imu0_remove_gravitational_acceleration: false

    # Выходной топик
    publish_tf: true
    publish_acceleration: false
