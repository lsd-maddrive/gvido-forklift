amcl:
  ros__parameters:
    use_sim_time: true
    alpha1: 0.00001
    alpha2: 0.00001
    alpha3: 0.00001
    alpha4: 0.00001
    alpha5: 0.00001
    base_frame_id: "base_link"
    beam_skip_distance: 0.5
    beam_skip_error_threshold: 0.9
    beam_skip_threshold: 0.3
    do_beamskip: false
    global_frame_id: "map"
    lambda_short: 0.1
    laser_likelihood_max_dist: 2.0
    laser_max_range: 100.0
    laser_min_range: -1.0
    laser_model_type: "likelihood_field"
    max_beams: 60
    max_particles: 2000
    min_particles: 500
    odom_frame_id: "odom"
    pf_err: 0.05
    pf_z: 0.99
    recovery_alpha_fast: 0.0
    recovery_alpha_slow: 0.0
    resample_interval: 1
    robot_model_type: "nav2_amcl::DifferentialMotionModel"
    save_pose_rate: 0.3
    sigma_hit: 0.2
    tf_broadcast: true
    transform_tolerance: 1.0
    update_min_a: 0.2
    update_min_d: 0.25
    z_hit: 0.5
    z_max: 0.05
    z_rand: 0.5
    z_short: 0.05
    scan_topic: /robot1/scan2

map_server:
  ros__parameters:
    use_sim_time: true
    yaml_filename: ""

map_saver:
  ros__parameters:
    use_sim_time: true
    save_map_timeout: 5.0
    free_thresh_default: 0.25
    occupied_thresh_default: 0.65
    map_subscribe_transient_local: true

bt_navigator:
  ros__parameters:
    use_sim_time: true
    enable_stamped_cmd_vel: false
    global_frame: map
    robot_base_frame: base_link
    odom_topic: odom
    bt_loop_duration: 10
    default_server_timeout: 20
    wait_for_service_timeout: 1000
    action_server_result_timeout: 900.0
    navigators: ["navigate_to_pose", "navigate_through_poses"]
    navigate_to_pose:
      plugin: "nav2_bt_navigator::NavigateToPoseNavigator"
    navigate_through_poses:
      plugin: "nav2_bt_navigator::NavigateThroughPosesNavigator"
    error_code_names:
      - compute_path_error_code
      - follow_path_error_code

controller_server:
  ros__parameters:
    controller_frequency: 20.0
    min_x_velocity_threshold: 0.001
    min_y_velocity_threshold: 0.001
    min_theta_velocity_threshold: 0.001
    progress_checker_plugins: ["progress_checker"] # progress_checker_plugin: "progress_checker" For Humble and older
    goal_checker_plugins: ["goal_checker"]
    controller_plugins: ["FollowPath"]

    progress_checker:
      plugin: "nav2_controller::SimpleProgressChecker"
      required_movement_radius: 0.5
      movement_time_allowance: 10.0

    goal_checker:
      plugin: "nav2_controller::SimpleGoalChecker"
      xy_goal_tolerance: 0.25
      yaw_goal_tolerance: 0.25
      stateful: True

    FollowPath:
      plugin: "nav2_regulated_pure_pursuit_controller::RegulatedPurePursuitController"
      max_linear_vel: 1.5
      min_linear_vel: 0.0
      max_angular_vel: 1.2
      min_angular_vel: -1.2

      max_linear_accel: 2.5 #if use_dynamic_window true
      max_linear_decel: -2.5 #if use_dynamic_window true
      max_angular_accel: 3.2 #if use_dynamic_window true
      max_angular_decel: -3.2 #if use_dynamic_window true
      use_dynamic_window: false

      lookahead_dist: 1.5 #only when use_velocity_scaled_lookahead_dist  is false
      min_lookahead_dist: 0.3 #only when use_velocity_scaled_lookahead_dist  is true
      max_lookahead_dist: 1.5 #only when use_velocity_scaled_lookahead_dist  is true
      lookahead_time: 1.5 # время в сек за которое прогназируется скорость если use_velocity_scaled_lookahead_dist is true
      use_velocity_scaled_lookahead_dist: false # Использовать ли масштабированные расстояния(true) прогнозирования скорости или постоянные значения lookahead_distance(false)
      
      transform_tolerance: 0.1

      rotate_to_heading_angular_vel: 1.0 # если use_rotate_to_heading true то это угловая сокрость, которую следует использовать
      use_rotate_to_heading: true #Включать ли вращение для приблизительного определения направления и цели при использовании голономных планировщиков. Рекомендуется включить для всех типов роботов, способных вращаться на месте.Примечание: значения use_rotate_to_headingи allow_reversingне могут быть установлены trueодновременно, так как это приведет к неоднозначности.
      rotate_to_heading_min_angle: 0.8 #Разница между ориентацией траектории и начальной ориентацией робота (в радианах), необходимая для запуска вращения на месте, если use_rotate_to_heading равна true.

      min_approach_linear_velocity: 0.08 #скорости (м/с), который необходимо применять при приближении к цели для обеспечения прогресса, >0.01!
      approach_velocity_scaling_dist: 1.7 #Расстояние (м), оставшееся на пути, при достижении которого следует начать замедление. Должно быть меньше половины ширины карты стоимости.
      
      use_collision_detection: true #  включать обнаружение столкновений
      max_allowed_time_to_collision_up_to_carrot: 2.0
      min_distance_to_obstacle: 0.3 # минимальное расстояние на котором разрешено находится роботу до препятствия
     
      use_regulated_linear_velocity_scaling: true #Следует ли использовать регулируемые параметры для коррекции кривизны траектории (например, замедление движения на траекториях с высокой кривизной).
      use_fixed_curvature_lookahead: false #Следует ли использовать фиксированное расстояние прогнозирования для вычисления кривизны? Поскольку расстояние прогнозирования может изменяться в зависимости от скорости, это может привести к появлению эталонного цикла, что может быть проблематично при больших расстояниях прогнозирования.
      curvature_lookahead_dist: 0.25 #Расстояние, на которое нужно смотреть вперед по траектории, чтобы обнаружить кривизну.

      use_cost_regulated_linear_velocity_scaling: true #Следует ли использовать регулируемые функции при приближении к препятствиям (например, замедлять движение в непосредственной близости от препятствий).
      cost_scaling_dist: 1.0 #Минимальное расстояние от препятствия, при котором начинается масштабирование линейной скорости, если use_cost_regulated_linear_velocity_scaling true . Значение должно быть меньше или равно значению inflation_radiusв слое инфляции карты стоимости, поскольку инфляция используется для вычисления расстояния до препятствий.
      cost_scaling_gain: 0.5 #Множитель, значение которого должно быть <= 1,0, используется для дальнейшего масштабирования скорости при наличии препятствия cost_scaling_dist. Меньшее значение приводит к более быстрому снижению скорости.

      regulated_linear_scaling_min_radius: 1.5 #Радиус поворота (м), при котором срабатывают функции регулирования, равен use_regulated_linear_velocity_scaling true. Помните, что более крутые повороты имеют меньший радиус.
      regulated_linear_scaling_min_speed: 0.25 #Минимальная скорость (м/с), с которой может передаваться любой из регулируемых эвристических алгоритмов, гарантирующая достижимость процесса даже в дорогостоящих пространствах с высокой кривизной. Должна быть .> 0.1
      allow_reversing: false #Позволяет роботу двигаться в обратном направлении, если запланированный маршрут включает в себя движение задним ходом (что обозначается ориентационными точками). Варианты smac_planner поддерживают движение задним ходом. Подробнее см. в описании Smac Planne


local_costmap:
  local_costmap:
    ros__parameters:
      use_sim_time: true
      enable_stamped_cmd_vel: false
      update_frequency: 5.0
      publish_frequency: 2.0
      global_frame: map
      robot_base_frame: base_link
      rolling_window: true
      width: 10
      height: 10
      resolution: 0.05
      footprint: "[ [1.5, 0.3], [1.5, -0.3], [-0.2, -0.3], [-0.2, 0.3] ]"
      plugins: ["static_layer", "voxel_layer", "inflation_layer"]
      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        cost_scaling_factor: 4.0
        inflation_radius: 1.8
      voxel_layer:
        plugin: "nav2_costmap_2d::VoxelLayer"
        enabled: true
        publish_voxel_map: true
        origin_z: 0.0
        z_resolution: 0.05
        z_voxels: 16
        max_obstacle_height: 2.0
        mark_threshold: 0
        observation_sources: scan
        scan:
          topic: /robot1/scan2
          max_obstacle_height: 2.0
          clearing: true
          marking: true
          data_type: "LaserScan"
          raytrace_max_range: 3.0
          raytrace_min_range: 0.5
          obstacle_max_range: 2.5
          obstacle_min_range: 0.5
      static_layer:
        plugin: "nav2_costmap_2d::StaticLayer"
        map_subscribe_transient_local: true
      always_send_full_costmap: true

global_costmap:
  global_costmap:
    ros__parameters:
      use_sim_time: true
      enable_stamped_cmd_vel: false
      update_frequency: 1.0
      publish_frequency: 1.0
      global_frame: map
      robot_base_frame: base_link
      footprint: "[ [1.5, 0.3], [1.5, -0.3], [-0.2, -0.3], [-0.2, 0.3] ]"
      resolution: 0.05
      track_unknown_space: true
      plugins: ["static_layer", "obstacle_layer", "inflation_layer"]
      obstacle_layer:
        plugin: "nav2_costmap_2d::ObstacleLayer"
        enabled: true
        observation_sources: scan
        scan:
          topic: /robot1/scan2
          max_obstacle_height: 2.0
          clearing: true
          marking: true
          data_type: "LaserScan"
          raytrace_max_range: 3.0
          raytrace_min_range: 0.5
          obstacle_max_range: 2.5
          obstacle_min_range: 0.5
      static_layer:
        plugin: "nav2_costmap_2d::StaticLayer"
        map_subscribe_transient_local: true
      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        cost_scaling_factor: 4.0
        inflation_radius: 1.8
      always_send_full_costmap: true

planner_server:
  ros__parameters:
    use_sim_time: true
    planner_plugins: ["GridBased"]

    GridBased:
      plugin: "nav2_smac_planner::SmacPlanner2D"
      tolerance: 0.3
      downsample_costmap: false
      downsampling_factor: 1
      allow_unknown: true
      max_iterations: 1000000
      max_on_approach_iterations: 1000
      max_planning_time: 2.0
      cost_travel_multiplier: 2.0
      use_final_approach_orientation: false
      smoother:
        max_iterations: 1000
        w_smooth: 0.3
        w_data: 0.2
        tolerance: 1.0e-10

smoother_server:
  ros__parameters:
    use_sim_time: true
    enable_stamped_cmd_vel: false
    smoother_plugins: ["simple_smoother"]
    simple_smoother:
      plugin: "nav2_smoother::SimpleSmoother"
      tolerance: 1.0e-10
      max_its: 1000
      do_refinement: true

behavior_server:
  ros__parameters:
    use_sim_time: true
    enable_stamped_cmd_vel: false
    local_costmap_topic: local_costmap/costmap_raw
    global_costmap_topic: global_costmap/costmap_raw
    local_footprint_topic: local_costmap/published_footprint
    global_footprint_topic: global_costmap/published_footprint
    cycle_frequency: 10.0
    behavior_plugins: ["spin", "backup", "drive_on_heading", "assisted_teleop", "wait"]
    spin:
      plugin: "nav2_behaviors::Spin"
    backup:
      plugin: "nav2_behaviors::BackUp"
    drive_on_heading:
      plugin: "nav2_behaviors::DriveOnHeading"
    wait:
      plugin: "nav2_behaviors::Wait"
    assisted_teleop:
      plugin: "nav2_behaviors::AssistedTeleop"
    global_frame: map
    local_frame: odom
    robot_base_frame: base_link
    transform_tolerance: 0.1
    simulate_ahead_time: 2.0
    max_rotational_vel: 1.0
    min_rotational_vel: 0.4
    rotational_acc_lim: 3.2

robot_state_publisher:
  ros__parameters:
    use_sim_time: true

waypoint_follower:
  ros__parameters:
    use_sim_time: true
    enable_stamped_cmd_vel: false
    loop_rate: 20
    stop_on_failure: false
    action_server_result_timeout: 900.0
    waypoint_task_executor_plugin: "wait_at_waypoint"
    wait_at_waypoint:
      plugin: "nav2_waypoint_follower::WaitAtWaypoint"
      enabled: true
      waypoint_pause_duration: 200

velocity_smoother:
  ros__parameters:
    use_sim_time: true
    enable_stamped_cmd_vel: false
    smoothing_frequency: 20.0
    scale_velocities: false
    feedback: "OPEN_LOOP"
    max_velocity: [0.8, 0.0, 1.5]
    min_velocity: [-0.26, 0.0, -1.5]
    max_accel: [2.5, 0.0, 4.5]
    max_decel: [-2.5, 0.0, -3.2]
    odom_topic: "odom"
    odom_duration: 0.1
    deadband_velocity: [0.0, 0.0, 0.0]
    velocity_timeout: 1.0

collision_monitor:
  ros__parameters:
    use_sim_time: true
    enable_stamped_cmd_vel: false
    base_frame_id: "base_link"
    odom_frame_id: "odom"
    cmd_vel_in_topic: "cmd_vel_smoothed"
    cmd_vel_out_topic: "cmd_vel"
    state_topic: "collision_monitor_state"
    transform_tolerance: 0.2
    source_timeout: 1.0
    base_shift_correction: true
    stop_pub_timeout: 2.0
    polygons: ["FootprintApproach"]
    FootprintApproach:
      type: "polygon"
      action_type: "approach"
      footprint_topic: "local_costmap/published_footprint"
      time_before_collision: 1.2
      simulation_time_step: 0.1
      min_points: 6
      visualize: false
      enabled: true
    observation_sources: ["scan"]
    scan:
      type: "scan"
      topic: /robot1/scan2
      min_height: 0.15
      max_height: 2.0
      enabled: true